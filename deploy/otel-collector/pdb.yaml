apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: collector
spec:
  minAvailable: 1
  # Readiness follows the pipelines; if Kafka is down every Collector is unready and a node
  # drain must still be able to proceed.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
