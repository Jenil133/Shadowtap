apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: collector
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/component: collector
        app: otel-collector # the Telemetry resource in deploy/istio selects the Collector by this
        sidecar.istio.io/inject: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: /metrics
        # Kafka is reached through the sidecar; start the Collector only once it is up and keep
        # it up while the sending queue drains on shutdown.
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
          terminationDrainDuration: 20s
    spec:
      serviceAccountName: otel-collector
      # k8sattributes watches pods and replica sets through the API, so unlike the tap this
      # pod needs its service account token.
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # the Collector image's own non-root user
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      containers:
        - name: otel-collector
          # Pinned: CI validates config.yaml with this exact build (scripts/validate-otel-collector.sh).
          image: otel/opentelemetry-collector-contrib:0.162.0
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          env:
            # Strimzi bootstrap Service of the Kafka cluster "shadowtap-kafka" in namespace
            # "kafka"; same listener and caveats as the tap (deploy/k8s/base/configmap.yaml).
            - name: KAFKA_BROKERS
              value: shadowtap-kafka-bootstrap.kafka.svc:9092
            # Pod identity for the Collector's own telemetry and for k8sattributes.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GOMEMLIMIT
              value: 460MiB # ~90% of limits.memory
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: http-metrics
              containerPort: 8888
              protocol: TCP
            - name: http-health
              containerPort: 13133
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http-health
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http-health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /
              port: http-health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # memory_limiter in config.yaml (384 + 96 MiB) is sized for this limit.
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true
      volumes:
        - name: config
          configMap:
            # Generated by kustomization.yaml from config.yaml; the name suffix changes with the
            # content, so a config change rolls the pods.
            name: otel-collector-config
