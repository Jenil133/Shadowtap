# Envoy v1.39 bootstrap for the local stack. Envoy stands in for the Istio sidecar in front of
# demo-api and streams every request to the tap over ext_proc:
#
#   :10000  observe: observability_mode, STREAMED bodies; Envoy never waits on the tap.
#   :10001  inline:  classic ext_proc, BUFFERED_PARTIAL bodies, mode_override for unsampled
#                    requests; the fallback for meshes older than Istio 1.23 / Envoy 1.31.
#   :10002  control: no ext_proc, to measure what the tap adds.
#   :9901   admin
#
# Both listeners set failure_mode_allow, so a tap outage never affects traffic. There is no
# access log on purpose: demo request paths and query strings carry (fake) personal data.

node:
  id: shadowtap-local-envoy
  cluster: shadowtap-local

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: observe
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: observe
                generate_request_id: true
                # Envoy's own span for each request goes to the Collector, so the sidecar hop
                # shows up in `shadowtap trace` next to the service and tap spans.
                tracing:
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      grpc_service:
                        envoy_grpc:
                          cluster_name: otel_collector
                        timeout: 0.25s
                      service_name: shadowtap-envoy
                  random_sampling:
                    value: 100
                route_config:
                  name: demo_api
                  virtual_hosts:
                    - name: demo_api
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: /
                          route:
                            cluster: demo_api
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: shadowtap_tap
                        initial_metadata:
                          - key: x-shadowtap-service
                            value: demo-api
                      # Send and go: replies are ignored, so the tap adds no latency.
                      observability_mode: true
                      failure_mode_allow: true
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SEND
                        request_body_mode: STREAMED
                        response_body_mode: STREAMED
                        # Free in observe mode, and without them a body followed by
                        # trailers (gRPC, chunked HTTP/1.1) never sees end_of_stream.
                        request_trailer_mode: SEND
                        response_trailer_mode: SEND
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: inline
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10001
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: inline
                generate_request_id: true
                tracing:
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      grpc_service:
                        envoy_grpc:
                          cluster_name: otel_collector
                        timeout: 0.25s
                      service_name: shadowtap-envoy
                  random_sampling:
                    value: 100
                route_config:
                  name: demo_api
                  virtual_hosts:
                    - name: demo_api
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: /
                          route:
                            cluster: demo_api
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: shadowtap_tap
                        initial_metadata:
                          - key: x-shadowtap-service
                            value: demo-api
                      observability_mode: false
                      failure_mode_allow: true
                      # The tap answers request_headers of unsampled requests with a
                      # mode_override that turns off every later message.
                      allow_mode_override: true
                      # Upper bound on what a sampled request can wait for one tap reply.
                      message_timeout: 0.2s
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SEND
                        request_body_mode: BUFFERED_PARTIAL
                        response_body_mode: BUFFERED_PARTIAL
                        request_trailer_mode: SKIP
                        response_trailer_mode: SKIP
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # Control: the same route with no ext_proc filter at all. Only for measuring what the tap
    # adds to a request (scripts/e2e-native.sh compares :10002 with :10000 and :10001).
    - name: control
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10002
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: control
                generate_request_id: true
                route_config:
                  name: demo_api
                  virtual_hosts:
                    - name: demo_api
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: /
                          route:
                            cluster: demo_api
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: demo_api
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
      load_assignment:
        cluster_name: demo_api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: demo-api
                      port_value: 8080

    # ext_proc is a gRPC stream, so this cluster must speak HTTP/2 (h2c: the tap is plaintext).
    - name: shadowtap_tap
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: shadowtap_tap
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: tap
                      port_value: 9002

    # The OpenTelemetry Collector (OTLP over gRPC) for Envoy's own spans.
    - name: otel_collector
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: otel_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: otel-collector
                      port_value: 4317
