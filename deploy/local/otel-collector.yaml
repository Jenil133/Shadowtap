# OpenTelemetry Collector (contrib) for the local compose stack: the pipeline of
# deploy/otel-collector/config.yaml without k8sattributes, which has no Kubernetes API to ask
# here. Envoy, the tap, the indexer and the demo services send OTLP to otel-collector:4317;
# spans and logs are buffered in Kafka for shadowtap-indexer.
#
#   OTLP gRPC :4317 / HTTP :4318 -> memory_limiter -> batch -> kafka
#                                     traces: shadowtap.otel.spans.v1   (otlp_proto)
#                                     logs:   shadowtap.otel.logs.v1    (otlp_proto)
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Sized for the 512m memory limit in compose.yaml.
  memory_limiter:
    check_interval: 1s
    limit_mib: 300
    spike_limit_mib: 80
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  kafka:
    brokers:
      - "${env:KAFKA_BROKERS:-kafka:9092}"
    client_id: otel-collector
    traces:
      topic: shadowtap.otel.spans.v1
      encoding: otlp_proto
    logs:
      topic: shadowtap.otel.logs.v1
      encoding: otlp_proto
    partition_traces_by_id: true
    producer:
      compression: zstd
      max_message_bytes: 1000000 # below the topics' max.message.bytes (1048576)
      required_acks: -1
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [kafka]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [kafka]
