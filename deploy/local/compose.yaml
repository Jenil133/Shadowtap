# Local Shadowtap stack: Kafka (KRaft), topic init, the demo services, the tap, Envoy standing
# in for the Istio sidecar, the OpenTelemetry Collector, the indexer, Elasticsearch and Kibana.
#
#   docker compose -f deploy/local/compose.yaml up -d --build --wait     (or: make up)
#
#   http://localhost:10000   demo-api through Envoy, ext_proc observe mode
#   http://localhost:10001   demo-api through Envoy, ext_proc inline mode
#   http://localhost:9901    Envoy admin
#   http://localhost:9090    tap admin: /healthz, /readyz, /metrics
#   http://localhost:9091    indexer admin: /healthz, /readyz, /metrics
#   localhost:29092          Kafka for host tools: shadowtap tail --brokers localhost:29092
#   http://localhost:8081    replay baseline: demo-api v1, fresh state (make replay)
#   http://localhost:8082    replay candidate: demo-api v2, deliberate regressions
#   localhost:4317           OpenTelemetry Collector (OTLP gRPC) for host-run binaries
#   http://localhost:9200    Elasticsearch: shadowtap trace --es http://localhost:9200
#   http://localhost:5601    Kibana (deploy/kibana/import.sh loads the dashboard)
#
# Published ports bind to 127.0.0.1 because nothing in this stack is authenticated.
name: shadowtap

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      # Any KAFKA_* variable replaces the image's default server.properties, so every
      # setting a single-node combined broker + controller needs is spelled out.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics come from kafka-init only, so a typo in a topic name fails loudly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: e1dOxNUgQaau2DHmW-xCZA
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      timeout: 20s
      retries: 24
      start_period: 20s

  # Creates every topic once the broker is healthy; everything that produces or consumes waits
  # for it, so a typo in a topic name fails loudly instead of being auto-created.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$1" --partitions 6 --replication-factor 1 \
            --config retention.ms=604800000 \
            --config message.timestamp.type=CreateTime \
            --config max.message.bytes=1048576
        }
        create shadowtap.captures.v1       # tap -> replayer, indexer (record timestamp = request start)
        create shadowtap.diffs.v1          # shadowtap replay --publish-diffs -> indexer
        create shadowtap.otel.spans.v1     # Collector -> indexer (OTLP protobuf)
        create shadowtap.otel.logs.v1      # Collector -> indexer (OTLP protobuf)
        create shadowtap.indexer.dlq.v1    # records the indexer could not index
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  demo-api:
    image: ghcr.io/jenil133/shadowtap-demo-api:dev
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        CMD: ./examples/demo/cmd/demo-api
    command: ["--addr", ":8080", "--version", "v1"]
    # Distroless has no shell or curl, so there is no container healthcheck; the e2e script
    # probes GET /healthz through Envoy instead.
    expose:
      - "8080"
    depends_on:
      - otel-collector

  tap:
    image: ghcr.io/jenil133/shadowtap-tap:dev
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        CMD: ./cmd/shadowtap-tap
    command: ["--config", "/etc/shadowtap/tap.yaml"]
    environment:
      SHADOWTAP_KAFKA_BROKERS: kafka:9092
      # Development only. In Kubernetes the key comes from the shadowtap-scrub-key Secret.
      SHADOWTAP_SCRUB_KEY: local-dev-scrub-key-not-for-production
      SHADOWTAP_SAMPLE_RATE: "1.0"
      POD_NAME: tap-local
      # Capture spans join the captured request's trace (deploy/local/otel-collector.yaml).
      SHADOWTAP_OTEL_ENABLED: "true"
      SHADOWTAP_OTEL_ENDPOINT: otel-collector:4317
    volumes:
      - ./tap.yaml:/etc/shadowtap/tap.yaml:ro
    ports:
      - "127.0.0.1:9090:9090"
    # Same constraints as the Kubernetes Deployment (read-only root, no capabilities).
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  # Replay targets. Not behind Envoy, so replayed traffic is not captured again.
  demo-api-baseline:
    image: ghcr.io/jenil133/shadowtap-demo-api:dev
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        CMD: ./examples/demo/cmd/demo-api
    command: ["--addr", ":8080", "--version", "v1"]
    ports:
      - "127.0.0.1:8081:8080"
  demo-api-candidate:
    image: ghcr.io/jenil133/shadowtap-demo-api:dev
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        CMD: ./examples/demo/cmd/demo-api
    command: ["--addr", ":8080", "--version", "v2"]
    ports:
      - "127.0.0.1:8082:8080"
  envoy:
    image: envoyproxy/envoy:v1.39-latest
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "127.0.0.1:10000:10000" # observe listener
      - "127.0.0.1:10001:10001" # inline listener
      - "127.0.0.1:10002:10002" # control listener (no tap), for overhead measurements
      - "127.0.0.1:9901:9901" # admin
    depends_on:
      - tap
      - demo-api
      - otel-collector

  # OTLP from Envoy, the tap, the indexer and the demo services -> Kafka, for the indexer.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      KAFKA_BROKERS: kafka:9092
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
      - "127.0.0.1:13133:13133" # health
    mem_limit: 512m
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false" # local only; the Kubernetes indexer uses credentials
      cluster.name: shadowtap
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "127.0.0.1:9200:9200"
    mem_limit: 1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:5601:5601"
    mem_limit: 1g
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # Kafka (captures, diffs, spans, logs) -> Elasticsearch. Bootstraps the index templates.
  indexer:
    image: ghcr.io/jenil133/shadowtap-indexer:dev
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        CMD: ./cmd/shadowtap-indexer
    command: ["--config", "/etc/shadowtap/indexer.yaml"]
    environment:
      SHADOWTAP_KAFKA_BROKERS: kafka:9092
      SHADOWTAP_ES_URL: http://elasticsearch:9200
      POD_NAME: indexer-local
    volumes:
      - ./indexer.yaml:/etc/shadowtap/indexer.yaml:ro
    ports:
      - "127.0.0.1:9091:9091"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      otel-collector:
        condition: service_started
