# Example only; NOT referenced by kustomization.yaml. Create the real Secret out of band, with
# the Elasticsearch user the indexer writes as (it needs manage_index_templates, manage_ilm and
# create_doc / auto_configure on traces-shadowtap-*, logs-shadowtap-*, shadowtap-captures,
# shadowtap-diffs):
#
#   kubectl create secret generic shadowtap-elasticsearch -n shadowtap \
#     --from-literal=username=shadowtap-indexer \
#     --from-literal=password="$(openssl rand -base64 24)"
#
# An API key works instead of a user: set SHADOWTAP_ES_API_KEY from a Secret key in
# deployment.yaml and drop the username/password entries.
apiVersion: v1
kind: Secret
metadata:
  name: shadowtap-elasticsearch
  namespace: shadowtap
type: Opaque
stringData:
  username: shadowtap-indexer
  password: replace-me
