apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-orders
  labels:
    app: demo-orders
    version: v1
spec:
  # Owns orders; asks demo-users whether a user exists. One replica: the store is in memory.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: demo-orders
  template:
    metadata:
      labels:
        # Not app: demo-api, so the capture EnvoyFilter leaves this hop alone.
        app: demo-orders
        version: v1
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: demo-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless "nonroot"
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-orders
          image: ghcr.io/jenil133/shadowtap-demo-api:latest
          args: ["--addr", ":8080", "--version", "v1", "--role", "orders", "--users-url", "http://demo-users:8080", "--otel", "--otel-endpoint", "otel-collector.shadowtap.svc:4317"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: demo-orders
  labels:
    app: demo-orders
spec:
  selector:
    app: demo-orders
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
      appProtocol: http
