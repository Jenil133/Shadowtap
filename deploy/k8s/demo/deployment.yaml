apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  labels:
    app: demo-api
    version: v1
spec:
  # demo-api keeps its users and orders in memory: one replica keeps reads consistent with
  # writes, so captured traffic replays the same way in Phase 2.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        # deploy/istio selects the sidecar to patch with app: demo-api.
        app: demo-api
        version: v1
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: demo-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless "nonroot"
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-api
          image: ghcr.io/jenil133/shadowtap-demo-api:latest
          args: ["--addr", ":8080", "--version", "v1"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
