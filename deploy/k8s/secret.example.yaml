# Example only. No kustomization references this file, so a real key never lands in git.
# Create the Secret out of band instead:
#
#   kubectl create secret generic shadowtap-scrub-key -n shadowtap --from-literal=scrub-key="$(openssl rand -hex 32)"
#
# The key (at least 16 bytes) seeds the HMAC pseudonyms that replace personal data. Every tap
# replica must share it, and rotating it changes every pseudonym, so captures taken before and
# after a rotation no longer join or diff cleanly. The placeholder below is deliberately
# shorter than 16 bytes: if this file is ever applied, the tap refuses to start.
apiVersion: v1
kind: Secret
metadata:
  name: shadowtap-scrub-key
  namespace: shadowtap
  labels:
    app.kubernetes.io/name: shadowtap-tap
    app.kubernetes.io/part-of: shadowtap
type: Opaque
stringData:
  scrub-key: CHANGE-ME
