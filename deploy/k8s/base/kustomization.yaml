# shadowtap-tap: the ext_proc capture server that meshed workloads stream traffic to.
#
# Prerequisites (not part of this base):
#   - the scrub key Secret, created out of band (see ../secret.example.yaml)
#   - the captures topic: ../kafka-topic.yaml (Strimzi) or your own tooling
#
#   kubectl kustomize deploy/k8s/base     # render
#   kubectl apply -k deploy/k8s/base      # install
#
# Pin a release in an overlay with an images: entry for ghcr.io/jenil133/shadowtap-tap.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shadowtap
labels:
  - pairs:
      app.kubernetes.io/part-of: shadowtap
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
