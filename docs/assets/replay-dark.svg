<text x="0" y="180" font-size="12" font-weight="normal" text-anchor="start" fill="#9CA3AF">Regressions reported for v2: renamed field phone → phone_number, 422 became 400 on POST /api/orders, +40 ms on POST /api/orders.</text>
<text x="0" y="200" font-size="12" font-weight="normal" text-anchor="start" fill="#9CA3AF">Noise is learned by sending each safe request to the baseline twice; a field that differs between those two answers is not a regression.</text>
